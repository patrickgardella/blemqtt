[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "blemqtt"
version = "0.1.0"
description = "Read BLE environmental sensors and publish them to MQTT with Home Assistant discovery"
requires-python = ">=3.11"
dependencies = [
    "bleak>=0.22",
    "paho-mqtt>=2.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "jinja2>=3",
]

[project.scripts]
blemqtt = "blemqtt.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
